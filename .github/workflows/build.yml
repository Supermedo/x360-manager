name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Package application
      run: npx electron-packager . "X360 Manager" --platform=win32 --arch=x64 --out=dist --overwrite
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: x360-manager-win32-x64
        path: dist/X360 Manager-win32-x64/
        
  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Package application
      run: npx electron-packager . "X360 Manager" --platform=win32 --arch=x64 --out=dist --overwrite
      
    - name: Create ZIP archive
      run: |
        cd dist
        Compress-Archive -Path "X360 Manager-win32-x64" -DestinationPath "X360-Manager-${{ github.ref_name }}-win32-x64.zip"
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/X360-Manager-${{ github.ref_name }}-win32-x64.zip
        body_path: .github/RELEASE_BODY_${{ github.ref_name }}.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}